<script>
/* Appwrite: Project ID sudah diisi di setProject() di bawah */
const AW_DB="6ad9dd52002c9a3515c5", AW_TB="6ad9ddb1003bfff1dbbd";
const AW_BK="6adb08f1000096bf9798";
let client=null, awDB=null, awST=null, awErr="";
try{
  client = new Appwrite.Client()
    .setEndpoint("https://cloud.appwrite.io/v1")
    .setProject("6ad88656002543a81d90");
  awDB = new Appwrite.Databases(client);
  awST = new Appwrite.Storage(client);
  try{client.ping()}catch(e){}
}catch(e){awErr=(e&&e.message)||String(e);console.error("Appwrite init gagal:",e)}
/* Cek kesiapan Appwrite; mengembalikan teks masalah, atau "" kalau siap */
function awCheck(){
  if(typeof Appwrite==="undefined")return "SDK Appwrite gagal dimuat. Cek koneksi internet atau akses ke cdn.jsdelivr.net.";
  if(!awDB)return "Appwrite belum terhubung: "+awErr;
  const pid=client&&client.config&&client.config.project;
  if(!pid||pid==="ID_PROJECT_WMS")return "Project ID belum diisi di index.html (masih ID_PROJECT_WMS).";
  return "";
}
/* Data pengecekan -> Appwrite. ID dokumen = ID record, jadi aman dikirim berulang (tidak dobel) */
let awSyncing=false;
const awRec=r=>{const d=new Date(r.dt);return{
  checker:[r.c1,r.c2].filter(Boolean).join(" / ")||"-",
  job:r.job||"-",
  shift:r.shift||"-",
  tanggal:(isNaN(d)?new Date():d).toISOString(),
  ampere:Number(r.kA),
  deskripsi:r.desc||"",
  json:JSON.stringify(Object.assign({},r,{photo:""}))}};
/* Foto -> Appwrite Storage (bucket AW_BK). Data hanya menyimpan photoId; perangkat lain mengunduh foto dari bucket */
async function awPhotoUp(r){
  if(!r.photo||r.photoId||!awST)return;
  if(r.photo.startsWith("data:")&&r.photo.length>IMG_MAX){const d=await new Promise(ok=>imgPack(r.photo,ok));if(d&&d.length<r.photo.length)r.photo=d}
  const b=await (await fetch(r.photo)).blob(),fid="f"+String(r.id);
  try{await awRetry(()=>awST.createFile(AW_BK,fid,new File([b],fid+".jpg",{type:"image/jpeg"})))}
  catch(e){if(!(e&&e.code==409))throw e}
  r.photoId=fid;
  try{if(typeof _awSave==="function"&&D)_awSave(true)}catch(e){}
}
async function awPhotoGet(r){
  let href="";
  try{
    href=String(awST.getFileView(AW_BK,r.photoId));
    const res=await fetch(href);if(!res.ok)throw new Error("HTTP "+res.status);
    const b=await res.blob();
    r.photo=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(b)});
    return true;
  }catch(e){
    console.error("Foto gagal diunduh:",e);
    if(href){r.photo=href;return true}
    return false;
  }
}
async function awPhotosGet(list){
  let got=0;
  for(let k=0;k<list.length;k+=3){
    const rs=await Promise.all(list.slice(k,k+3).map(awPhotoGet));
    got+=rs.filter(Boolean).length;
  }
  return got;
}
const awWait=ms=>new Promise(z=>setTimeout(z,ms));
/* Kalau kena rate limit (429), tunggu lalu coba lagi: 1.5s, 3s, 6s, 12s, 24s */
async function awRetry(fn){for(let n=0;;n++){try{return await fn()}catch(e){if(!(e&&e.code==429)||n>=5)throw e;await awWait(1500*Math.pow(2,n))}}}
/* Tanda "sudah sinkron": hash isi data (tanpa foto) disimpan per akun, supaya hanya data baru/berubah yang dikirim */
const awSigKey=()=>"wms_sig_"+((typeof U!=="undefined"&&U&&U.id)||"x");
function awSigMap(){try{return JSON.parse(localStorage.getItem(awSigKey())||"{}")}catch(e){return{}}}
function awSig(r){const t=awRec(r).json;let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return h+"."+t.length}
function awSigSet(r){try{const m=awSigMap();m[String(r.id)]=awSig(r);localStorage.setItem(awSigKey(),JSON.stringify(m))}catch(e){}}
function awNeed(r){if(r.photo&&!r.photoId)return true;return awSigMap()[String(r.id)]!==awSig(r)}
async function awUpsert(r){
  if(r.photo&&!r.photoId){try{await awPhotoUp(r)}catch(e){console.error("Foto gagal diunggah:",e);if(typeof toast==="function")toast("Foto gagal diunggah: "+((e&&e.message)||e))}}
  const id=String(r.id),data=awRec(r),known=!!awSigMap()[id];
  await awRetry(async()=>{
    try{if(known)await awDB.updateDocument(AW_DB,AW_TB,id,data);else await awDB.createDocument(AW_DB,AW_TB,id,data)}
    catch(e){if(known&&e&&e.code==404)await awDB.createDocument(AW_DB,AW_TB,id,data);else if(!known&&e&&e.code==409)await awDB.updateDocument(AW_DB,AW_TB,id,data);else throw e}
  });
  awSigSet(r);
}
async function awPut(r){
  try{await awUpsert(r)}
  catch(e){console.error("Appwrite gagal:",e);if(typeof toast==="function")toast("Appwrite gagal: "+((e&&e.message)||e))}
}
/* Hapus = tombstone: dokumen TIDAK dihapus, isinya diganti penanda {id,del:waktu} supaya perangkat lain ikut menghapus saat sinkron */
async function awDel(id,pid,rec){
  if(pid&&awST){try{await awST.deleteFile(AW_BK,String(pid))}catch(e){}}
  const did=String(id),base=rec?awRec(rec):{checker:"-",job:"-",shift:"-",tanggal:new Date().toISOString(),ampere:0};
  const data=Object.assign({},base,{deskripsi:"",json:JSON.stringify({id:rec?rec.id:id,del:Date.now()})});
  try{
    await awRetry(async()=>{
      try{await awDB.updateDocument(AW_DB,AW_TB,did,data)}
      catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_TB,did,data);else throw e}
    });
    try{const m=awSigMap();delete m[did];localStorage.setItem(awSigKey(),JSON.stringify(m))}catch(e){}
  }catch(e){console.error("Appwrite hapus gagal:",e)}
}
/* Waktu sinkron terakhir (dari jam server, $updatedAt) per akun, supaya tarik data cukup yang berubah saja */
const awPullKey=()=>"wms_pull_"+((typeof U!=="undefined"&&U&&U.id)||"x");
function awPullGet(){try{return localStorage.getItem(awPullKey())||null}catch(e){return null}}
function awPullSet(v){try{localStorage.setItem(awPullKey(),v)}catch(e){}}
/* Tarik data dari server yang belum ada di perangkat ini (foto tidak ikut) */
async function awPullAll(silent){
  const u=U;
  try{
    /* Hanya ambil data yang berubah sejak sinkron terakhir ($updatedAt); pertama kali / data lokal kosong = ambil semua */
    const since=(D.insp&&D.insp.length)?awPullGet():null;
    const list1=async sn=>{const out=[];let last=null;
      for(;;){
        const q=[Appwrite.Query.limit(100)];if(sn)q.push(Appwrite.Query.greaterThanEqual("$updatedAt",sn));if(last)q.push(Appwrite.Query.cursorAfter(last));
        const r=await awDB.listDocuments(AW_DB,AW_TB,q);
        out.push(...r.documents);
        if(r.documents.length<100)break;
        last=r.documents[r.documents.length-1].$id;
      }
      return out};
    let docs;
    try{docs=await list1(since)}
    catch(e){if(!since)throw e;console.warn("Tarik data bertahap gagal, ambil semua:",e);docs=await list1(null)}
    if(U!==u||!D)return -1;
    let maxU=since||"";docs.forEach(d=>{if(d.$updatedAt&&d.$updatedAt>maxU)maxU=d.$updatedAt});
    const have=new Map(D.insp.map(x=>[String(x.id),x]));let added=0,upd=0,gone=0;const pend=[];
    /* foto yang belum terunduh di perangkat ini tetap dicoba lagi (seperti sebelumnya) */
    D.insp.forEach(x=>{if(x.photoId&&!x.photo)pend.push(x)});
    for(const d of docs){
      if(!d.json)continue;
      let o;try{o=JSON.parse(d.json)}catch(e){continue}
      if(!o||!o.id)continue;
      const loc=have.get(String(o.id));
      if(o.del){/* tombstone: hapus lokal kecuali data lokal lebih baru dari penghapusan (mis. hasil undo/edit) */
        if(loc&&!((loc.ea||0)>o.del)){D.insp=D.insp.filter(x=>String(x.id)!==String(o.id));have.delete(String(o.id));gone++}
        continue}
      if(loc){if((o.ea||0)>(loc.ea||0)){const ph=loc.photo,op=loc.photoId;Object.assign(loc,o);loc.photo=(o.photoId||'')==(op||'')?ph:'';upd++;if(!loc.photo&&o.photoId)pend.push(loc)}else if(!loc.photo&&o.photoId){loc.photoId=o.photoId;pend.push(loc)}continue}
      o.photo=o.photo||"";D.insp.push(o);have.set(String(o.id),o);added++;
      if(o.photoId&&!o.photo)pend.push(o);
    }
    const pU=[...new Set(pend)],got=pU.length?await awPhotosGet(pU):0;
    if(U!==u||!D)return -1;
    if(added||got||upd||gone){
      D.insp.sort((x,y)=>(y.created||0)-(x.created||0));
      _awSave(true);render();
      {const ps=[];if(added)ps.push(added+" data baru");if(upd)ps.push(upd+" data diperbarui");if(gone)ps.push(gone+" data dihapus");if(got)ps.push(got+" foto");toast(ps.join(", ")+" diambil dari server")}
    }
    if(maxU)awPullSet(maxU);
    return added;
  }catch(e){
    console.error("Appwrite ambil data gagal:",e);
    if(!silent)toast("Ambil data gagal: "+((e&&e.message)||e));
    return -1;
  }
}
/* Tombol "Upload Data": kirim semua data lokal, lalu ambil data baru dari server */
async function awSyncAll(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  awSyncing=true;toast("Memulai update ke server...");
  const P=p=>{if(typeof awProg=="function")awProg(p)};
  try{
    P(3);
    const pulled=await awPullAll(true);
    P(10);
    const all=(D.insp||[]).slice(),list=all.filter(awNeed);
    let ok=0,fail=0,err="",stop=false;
    for(let k=0;k<list.length&&!stop;k++){
      try{await awUpsert(list[k]);ok++}
      catch(e){fail++;err=(e&&e.message)||String(e);if(e&&e.code==429)stop=true;console.error("Appwrite gagal:",e)}
      toast("Mengirim "+(k+1)+"/"+list.length+"...");
      P(10+80*(k+1)/list.length);
      if(k<list.length-1)await awWait(250);
    }
    const left=list.length-ok-fail,skip=all.length-list.length;
    P(92);
    const added=pulled;
    let m=ok+" data terkirim";
    if(skip>0)m+=", "+skip+" data sudah sinkron";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(left>0)m+=", "+left+" data belum dikirim";
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    if(!all.length&&added===0){toast("Belum ada data di perangkat ini, server juga kosong")}
    else if(!fail&&!left&&added>=0){P(100);awSuccess("Update berhasil",m)}
    else alert(m+(stop?"\n\nBatas request server tercapai. Tunggu sekitar 1 menit lalu klik Upload Data lagi. Hanya data yang belum terkirim yang akan dikirim.":""));
  }catch(e){
    console.error("Update gagal:",e);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
/* Suara "cling" (sintesis Web Audio, tanpa file) */
let awAC=null;
function awAudio(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;if(!awAC)awAC=new C();if(awAC.state==="suspended")awAC.resume();return awAC}catch(e){return null}}
document.addEventListener("pointerdown",awAudio,{passive:true});
function awCling(){
  try{if(localStorage.getItem("woms_mute")==="1")return}catch(e){}
  const a=awAudio();if(!a)return;
  try{
    const t=a.currentTime,g=a.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.35,t+0.005);g.gain.exponentialRampToValueAtTime(0.0001,t+1.1);
    g.connect(a.destination);
    [[1318.5,0],[1975.5,0.09],[2637,0.09]].forEach(([f,d],i)=>{
      const o=a.createOscillator(),h=a.createGain();
      o.type="sine";o.frequency.value=f;h.gain.value=i==2?0.25:1;
      o.connect(h);h.connect(g);o.start(t+d);o.stop(t+1.2);
    });
  }catch(e){}
}
/* Animasi centang + notifikasi berhasil */
function awSuccess(title,sub){try{hap('ok')}catch(e){}
  if(!document.getElementById("aw-css")){
    const st=document.createElement("style");st.id="aw-css";
    st.textContent=".aw-ok{position:fixed;top:0;left:0;width:100%;height:100%;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);animation:awf .2s}"+
    ".aw-card{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cd,#fff);color:var(--tx,#0f172a);border-radius:16px;padding:16px 22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:awp .3s;max-width:80%}"+
    ".aw-ok svg{display:block;margin:0 auto;flex:none}"+
    ".aw-ok circle{transform:rotate(-90deg);transform-origin:26px 26px}"+
    ".aw-ok circle{stroke-dasharray:166;stroke-dashoffset:166;animation:awd .6s .1s forwards}"+
    ".aw-ok path{stroke-dasharray:48;stroke-dashoffset:48;animation:awd .4s .6s forwards}"+
    "@keyframes awd{to{stroke-dashoffset:0}}@keyframes awf{from{opacity:0}}@keyframes awp{from{transform:scale(.8);opacity:0}}";
    document.head.appendChild(st);
  }
  const t=document.getElementById("t");if(t)t.style.display="none";
  const old=document.querySelector(".aw-ok");if(old)old.remove();
  const d=document.createElement("div");d.className="aw-ok";
  d.innerHTML='<div class="aw-card"><svg width="52" height="52" viewBox="-2 -2 56 56" fill="none" stroke="#16a34a" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24" stroke-width="3"/><path d="M14 26l8 8 16-16" stroke-width="4"/></svg><div style="font-weight:700;font-size:15px;margin-top:6px">'+title+'</div><div style="font-size:12px;opacity:.7;margin-top:2px">'+sub+'</div></div>';
  d.onclick=()=>d.remove();
  document.body.appendChild(d);
  awCling();
  try{const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;if(H&&H.impact)H.impact({style:"LIGHT"});else if(navigator.vibrate)navigator.vibrate(40)}catch(e){}
  setTimeout(()=>{if(d.parentNode)d.remove()},2400);
}
</script>

function mm(op,a,b,k,v){const m=draft[a];
if(op=='addMain'){const c=prompt('Kode Main Equipment (mis. Trafo 24)');if(!c)return;draft.push({id:'m'+uid8(),code:c,loc:D.M.locs[0]||'',subs:[]})}
else if(op=='delMain'){if(confirm('Hapus '+m.code+'?'))draft.splice(a,1)}
else if(op=='loc')m.loc=b;
else if(op=='mc')m.code=b.trim()||m.code;
else if(op=='addSub')m.subs.push({id:'s'+uid8(),name:'',type:tyList()[0]||'',mats:[]});
else if(op=='delSub')m.subs.splice(b,1);
else if(op=='sn')m.subs[b].name=k;else if(op=='st')m.subs[b].type=k;
else if(op=='addMat')m.subs[b].mats.push({id:'x'+uid8(),mt:D.M.mats[0]||'',tg:0,al:'',min:0,max:0});
else if(op=='delMat')m.subs[b].mats.splice(k,1);
else if(op=='mt')m.subs[b].mats[k].mt=v;
else if(op=='tg'){const x=m.subs[b].mats[k],t=parseFloat(v)||0;x.tg=r2(t);if(x.al!=null&&x.al!==''){x.min=Math.max(0,r2(t*(1-x.al/100)));x.max=r2(t*(1+x.al/100))}else{x.min=Math.max(0,r2(t-0.5));x.max=r2(t+0.5)}}
else if(op=='al'){const x=m.subs[b].mats[k],p=parseFloat(v);if(v===''||isNaN(p)){x.al=''}else{const q=Math.max(0,p),t=tgOf(x);x.al=r2(q);x.min=Math.max(0,r2(t*(1-q/100)));x.max=r2(t*(1+q/100))}}
else if(op=='min'||op=='max'){const x=m.subs[b].mats[k];x[op]=parseFloat(v)||0;x.tg=r2((x.min+x.max)/2);x.al=x.tg>0?r2((x.max-x.min)/2/x.tg*100):''}
render()}

/* geser kartu ke kiri untuk menampilkan tombol hapus (sentuh & mouse) */
let swClose=()=>{};
(function(){const W=84;let s=null,open=null,sup=0;
 const shut=c=>{if(!c)return;c.classList.remove('open');const n=c.querySelector('.sw-in');if(n)n.style.transform='';if(open===c)open=null};
 swClose=()=>shut(open);
 document.addEventListener('pointerdown',e=>{
  if(open&&!document.contains(open))open=null;
  const t=e.target.closest?e.target:e.target.parentNode;if(t.closest('.sw-del'))return;
  const inn=t.closest('.sw-in');
  if(open&&(!inn||inn.parentNode!==open))shut(open);
  if(!inn||(e.pointerType=='mouse'&&e.button!==0))return;
  const c=inn.parentNode;c.classList.remove('hint');inn.style.animation='none';
  s={c,inn,x:e.clientX,y:e.clientY,base:c.classList.contains('open')?-W:0,id:e.pointerId,lock:null,t:0}});
 document.addEventListener('pointermove',e=>{
  if(!s||e.pointerId!==s.id)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(s.lock===null){if(Math.abs(dx)<6&&Math.abs(dy)<6)return;s.lock=Math.abs(dx)>Math.abs(dy)?'x':'y';
   if(s.lock=='x'){s.inn.classList.add('drag');s.c.classList.add('drag');try{s.inn.setPointerCapture(e.pointerId)}catch(x){}}}
  if(s.lock!=='x')return;
  s.t=Math.min(0,Math.max(-W-20,s.base+dx));s.inn.style.transform='translateX('+s.t+'px)'});
 const end=e=>{if(!s||e.pointerId!==s.id)return;const{c,inn}=s;inn.classList.remove('drag');c.classList.remove('drag');
  if(s.lock=='x'){sup=Date.now();
   if(s.t<-W/2){if(open&&open!==c)shut(open);c.classList.add('open');open=c;inn.style.transform='translateX(-'+W+'px)'}
   else{c.classList.remove('open');if(open===c)open=null;inn.style.transform=''}}
  s=null};
 document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
 document.addEventListener('click',e=>{
  if(Date.now()-sup<350){e.stopPropagation();e.preventDefault();sup=0;return}
  const t=e.target.closest?e.target:e.target.parentNode,inn=t.closest('.sw-in');
  if(inn&&inn.parentNode.classList.contains('open')){e.stopPropagation();e.preventDefault();shut(inn.parentNode)}},true);
})();

const QS={p:0,show:false,err:false,t:0,busy:false,q:0,m:'',pn:0};

/* mode: manual = tombol Update Server (progress + centang), pal = setelah simpan palet (progress + centang), auto = setelah perubahan (progress saja), poll = cek berkala (diam kecuali ada data yang bergerak) */
async function qgSync(mode){
  if(!D||!U)return;
  if(QS.busy){clearTimeout(awT);if(mode!='poll'){QS.q=1;if(mode=='manual'||mode=='pal')QS.m=mode}return}
  const quiet=mode=='poll',pre=awCheck();
  if(pre){if(mode=='manual')alert(pre);else if(!quiet)qsSet(100,true,true);return}
  QS.busy=true;clearTimeout(awT);
  window.awPg=f=>{if(!quiet||QS.show)qsSet(Math.min(94,22+72*f))};
  try{
    if(!quiet)qsSet(8);
    const res=await awMasterSync();

/* ---------- C/M (Counter Measure) kini per defect (di dalam kotak Defect): m.c = action, m.e = foto Evidence (dikompres otomatis maks 100 KB). x[4] hanya tersisa untuk data lama ---------- */
const qgCm=v=>({t:String(v&&v.t||''),i:String(v&&v.i||'')});

const qgBytes=u=>Math.floor((u.length-u.indexOf(',')-1)*3/4);
function qgMkUp(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;if(!/^image\//.test(f.type))return toast('File harus berupa gambar');const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const MAX=100000;let u='',ok=false;
outer:for(const mx of [1000,800,640,480,360,280]){const sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);for(const q of [.72,.6,.5,.4,.3]){u=c.toDataURL('image/jpeg',q);if(qgBytes(u)<=MAX){ok=true;break outer}}}
if(!ok)return toast('Foto tidak bisa dikecilkan sampai 100 KB, coba foto lain');
if(QG.df){QG.df.pe=u;QG.df.po=f.size;render();toast('Evidence siap ('+Math.round(qgBytes(u)/1024)+' KB)')}};im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=rd.result};rd.readAsDataURL(f)}

function qgStack(d,pct){const L=d.L;if(!L.length)return'';const mx=Math.max(1,...L.map(k=>d.m[k].ok+d.m[k].ng)),W=300,H=110,bw=Math.min(46,(W-20)/L.length-14);

/* ---------- SINKRON MASTER KE APPWRITE ---------- */
const AW_MT="6ad9e3270004fcc8e26d", AW_CH=15000;
/* Collection khusus akun/role/presence (u_, v_, p_). Default = AW_MT supaya tetap jalan; ganti ke ID collection baru setelah dibuat di console (lihat SECURITY.md) */
const AW_AC=AW_MT;
let awLast=null, awBusy=false, awT=null;
const _awSave=save, _awLoad=load;
const awSnap=()=>JSON.stringify({mains:D.mains,M:D.M});
const awHdr=t=>{const m=/^(\d+)\/(\d+)\|/.exec(t||'');return m?{i:+m[1],n:+m[2],body:t.slice(m[0].length)}:null};
/* Ambil potongan master_1..n PARALEL (4 sekaligus) */
async function awChunksGet(n,first){const out=new Array(n);out[0]=first;let k=1,dn=0;
  await Promise.all(Array.from({length:Math.min(4,Math.max(0,n-1))},async()=>{for(;;){const i=k++;if(i>=n)return;const c=awHdr((await awRetry(()=>awDB.getDocument(AW_DB,AW_MT,'master_'+i))).data);out[i]=c?c.body:'';dn++;if(window.awPg)awPg(dn/n)}}));
  return out.join('')}
/* Sinkron master (termasuk data Quality Gate) versi cepat: cek header server dulu, tarik hanya kalau server lebih baru, kirim hanya kalau lokal lebih baru / berubah.
   Return 'pull' | 'push' | 'same' | false (gagal) */
async function awMasterSync(){
  const u=U;for(let k=0;k<30&&awBusy;k++)await awWait(200);
  let h=null;
  try{h=awHdr((await awRetry(()=>awDB.getDocument(AW_DB,AW_MT,'master_0'))).data)}catch(e){if(!(e&&e.code==404))throw e}
  if(U!==u||!D)return false;
  const m=h&&/^\{"t":(\d+)/.exec(h.body),st=m?+m[1]:null;
  if(h&&(st==null||st>(D.masterT||0))){
    const o=JSON.parse(await awChunksGet(h.n,h.body));
    if(U!==u||!D)return false;
    if(!D.masterT||o.t>D.masterT){D.mains=o.mains;D.M=o.M;D.masterT=o.t;norm();_awSave(true);awLast=awSnap();render();return 'pull'}
    if(D.masterT>o.t){awLast='';return (await awMasterPush())?'push':false}
    awLast=awSnap();return 'same'}
  if(!h||awSnap()!==awLast||(D.masterT||0)>st){awLast='';return (await awMasterPush())?'push':false}
  return 'same'}
async function awMasterPull(){
  const u=U;
  try{
    const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);
    if(!h) throw {code:404};
    let txt=await awChunksGet(h.n,h.body);
    const o=JSON.parse(txt);
    if(U!==u||!D) return;
    if(!D.masterT||o.t>D.masterT){
      D.mains=o.mains;D.M=o.M;D.masterT=o.t;norm();_awSave(true);awLast=awSnap();
      render();toast('Master diperbarui dari server');
    }else if(D.masterT>o.t){awLast='';awMasterPush()}
    else awLast=awSnap();
  }catch(e){
    if(e&&e.code==404&&U===u&&D){D.masterT=D.masterT||Date.now();_awSave(true);awLast='';awMasterPush()}
    else console.error('Appwrite master (ambil) gagal:',e);
  }
}
async function awMasterPush(){
  if(!D||!U)return false;
  if(awBusy){clearTimeout(awT);awT=setTimeout(awMasterPush,1500);return false}
  awBusy=true;
  try{
    const snap=awSnap();
    const json=JSON.stringify({t:D.masterT||Date.now(),mains:D.mains,M:D.M});
    const parts=[];for(let i=0;i<json.length;i+=AW_CH)parts.push(json.slice(i,i+AW_CH));
    let oldN=0;
    try{const h=awHdr((await awDB.getDocument(AW_DB,AW_MT,'master_0')).data);if(h)oldN=h.n}catch(e){}
    /* Kirim potongan master PARALEL (4 sekaligus), header master_0 terakhir supaya perangkat lain tidak menarik data setengah jadi */
    const put=async i=>{const id='master_'+i,data={data:i+'/'+parts.length+'|'+parts[i]};
      await awRetry(async()=>{try{await awDB.updateDocument(AW_DB,AW_MT,id,data)}
      catch(e){if(e&&e.code==404)await awDB.createDocument(AW_DB,AW_MT,id,data);else throw e}})};
    let nx=1,dn=0;
    await Promise.all(Array.from({length:Math.min(4,Math.max(0,parts.length-1))},async()=>{for(;;){const i=nx++;if(i>=parts.length)return;await put(i);dn++;if(window.awPg)awPg(dn/parts.length)}}));
    await put(0);if(window.awPg)awPg(1);
    for(let k=parts.length;k<oldN;k++){try{await awDB.deleteDocument(AW_DB,AW_MT,'master_'+k)}catch(e){}}
    awLast=snap;awBusy=false;return true;
  }catch(e){console.error('Appwrite master (kirim) gagal:',e);toast('Master gagal dikirim: '+((e&&e.message)||e))}
  awBusy=false;return false;
}
async function awMasterNow(q){

  const ok=await awMasterPush();
  if(ok&&!q)toast('Master terkirim ke server (semua perangkat)');
  return ok;
}
async function awUpdateServer(){
  if(awSyncing){toast("Update sedang berjalan...");return}
  const pre=awCheck();
  if(pre){alert(pre);return}
  if(!D||!U)return;
  awSyncing=true;toast("Mengirim setting ke server...");SC.t=0;spSet(8,false);
  try{
    clearTimeout(awT);D.masterT=Date.now();_awSave(true);
    let mok=await awMasterPush();
    if(!mok){await new Promise(z=>setTimeout(z,1600));mok=await awMasterPush()}
    spSet(30,false);
    const pulled=await awPullAll(true);spSet(40,false);
    let ok=0,fail=0,err="",stop=false;
    const all=(D.insp||[]).slice(),list=all.filter(awNeed);
    for(let k=0;k<list.length&&!stop;k++){
      try{await awUpsert(list[k]);ok++}
      catch(e){fail++;err=(e&&e.message)||String(e);if(e&&e.code==429)stop=true;console.error("Appwrite gagal:",e)}
      toast("Mengirim data "+(k+1)+"/"+list.length+"...");
      spSet(40+Math.round((k+1)/list.length*40),false);
      if(k<list.length-1)await awWait(250);
    }
    spSet(85,false);
    const added=pulled;
    let m="Setting & master "+(mok?"terkirim":"GAGAL dikirim")+", "+ok+" data pengecekan terkirim";
    if(added>0)m+=", "+added+" data baru dari server";
    if(fail)m+=", gagal "+fail+": "+err;
    if(added<0&&!fail)m+=" (ambil data dari server gagal)";
    const good=mok&&!fail&&added>=0;
    spSet(100,!good,true);
    if(good){D.sync.last=new Date().toLocaleString(LC());_awSave(true);awSuccess("Update berhasil",m)}
    else alert(m+(stop?"\n\nBatas request server tercapai. Tunggu sekitar 1 menit lalu coba lagi. Hanya data yang belum terkirim yang akan dikirim.":""));
    render();
  }catch(e){
    console.error("Update gagal:",e);spSet(100,true,true);alert("Update gagal: "+((e&&e.message)||e));
  }finally{awSyncing=false}
}
async function awSaveSync(r){
  const pre=awCheck();
  if(pre){toast("Tersimpan di perangkat. Server: "+pre);spSet(100,true,true);return}
  if(awSyncing){spSet(30,false);try{await awUpsert(r);spSet(100,false,true)}catch(e){spSet(100,true,true);toast("Kirim ke server gagal: "+((e&&e.message)||e))}return}
  awSyncing=true;toast("Mengirim ke server...");spSet(8,false);
  try{
    await awUpsert(r);spSet(40,false);
    let mok=true;
    if(D&&awLast!==null&&awSnap()!==awLast){clearTimeout(awT);D.masterT=Date.now();_awSave(true);mok=await awMasterPush()}
    spSet(60,false);
    await awMasterPull();spSet(78,false);
    const added=await awPullAll(true);spSet(94,false);
    if(D){D.sync.last=new Date().toLocaleString(LC());_awSave(true)}
    spSet(100,!(mok&&added>=0),true);
    let m="Data terkirim ke server";
    if(added>0)m+=", "+added+" data baru dari perangkat lain";
    if(mok&&added>=0)awSuccess("Tersimpan & terupdate",m);
    else alert(m+(mok?"":" (master gagal dikirim)")+(added<0?" (ambil data dari server gagal)":""));
  }catch(e){
    console.error("Simpan & update server gagal:",e);spSet(100,true,true);
    alert("Data tersimpan di perangkat, tetapi gagal dikirim ke server: "+((e&&e.message)||e)+". Coba lagi lewat tombol Upload Data di tab Data.");
  }finally{awSyncing=false}
}

const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhx=s=>new Uint8Array((s.match(/../g)||[]).map(x=>parseInt(x,16)));

async function chkVer(v,e,p){return (await pbk(e+'|'+p,unhx(v.s)))===v.h}

  return`<div class="text-xs mt-1"><span class="apBx apPd">Pending approval</span></div>${canAp1(i)?`<button type="button" class="b apAct" style="margin-top:6px;padding:6px 12px;font-size:12px" onclick="event.stopPropagation();apDo('${i.id}')">&#10003; Approve</button>`:''}`};
const apBtn=i=>canAp1(i)?`<button class="b mt-3 apAct" style="width:100%" onclick="apDo('${i.id}')">&#10003; Approve Data</button>`:(i.ap=='a'&&(isDev()||String(i.apBy||'').toLowerCase()==myEm())?`<button class="b b2 mt-3" style="width:100%" onclick="apUndo('${i.id}')">Batalkan Approval</button>`:'');
const apBan=a=>{const m=new Map();a.forEach(i=>{if(i.ap=='a'){const k=(i.apName||i.apBy||'-')+'|'+(i.apRole||'');m.set(k,(m.get(k)||0)+1)}});const pend=D.insp.filter(i=>apSt(i)=='p').length;
  if(!m.size)return`<div class="c" style="border-left:4px solid #eab308"><div class="flex justify-between items-center w-full" style="gap:10px"><b style="color:#a16207">Belum ada data yang di-approve</b>${pend?`<span style="font-size:11px;line-height:12px;text-align:right;color:#a16207;max-width:46%">${pend} data masih Pending approval</span>`:''}</div></div>`;
  return`<div class="c text-sm" style="border-left:4px solid #16a34a">${m.size?`<b style="color:#16a34a">&#10003; Data sudah di-approve</b><div class="text-xs mt-1">${[...m].map(([k,n])=>{const[nm,rl]=k.split('|');return esc(nm)+(rl?' ('+esc(rl)+')':'')+' - '+n+' data'}).join('<br>')}</div>`:`<b style="color:#a16207">Belum ada data yang di-approve</b>`}${pend?`<div class="text-xs mt-1" style="color:#a16207">${pend} data masih Pending approval</div>`:''}</div>`};
function apStamp(i){i.ap='a';i.apBy=myEm();i.apName=(D.prof&&D.prof.name)||U.name||myEm();i.apRole=myLvl()?lvlName(myLvl()):'Developer';i.apAt=Date.now();i.ea=Date.now()}
async function apPush(list){save(true);list.forEach(cloudPut);render();const pre=awCheck();if(pre)return toast('Tersimpan di perangkat. Server: '+pre);try{for(const i of list)await awUpsert(i)}catch(e){toast('Kirim ke server gagal: '+((e&&e.message)||e))}}
function apDo(id){const i=D.insp.find(x=>x.id==id);if(!i||apSt(i)=='a')return;if(!canApprove())return toast('Hanya Foreman / Supervisor / Developer yang bisa approve');if(isMine(i)&&!isDev())return toast('Tidak bisa approve data sendiri');undoPush({t:'ap',snaps:[apSnap(i)],by:U.id});apStamp(i);apPush([i]);awSuccess('Data di-approve','Approval berhasil')}
function apDay(){if(!canApprove())return;const all=filt(Q),l=all.filter(canAp1),own=isDev()?0:all.filter(i=>apSt(i)=='p'&&isMine(i)).length;if(!l.length)return toast(own?'Data pending di tanggal ini milik Anda sendiri, tidak bisa di-approve':'Tidak ada data Pending approval pada tanggal ini');if(!confirm('Approve '+l.length+' data tanggal '+Q.cal+'?'))return;undoPush({t:'ap',snaps:l.map(apSnap),by:U.id});l.forEach(apStamp);apPush(l);awSuccess(l.length+' data di-approve',own?own+' data milik sendiri dilewati':'Approval berhasil')}
function apUndo(id){const i=D.insp.find(x=>x.id==id);if(!i||i.ap!='a')return;if(!(isDev()||String(i.apBy||'').toLowerCase()==myEm()))return;if(!confirm('Batalkan approval data ini?'))return;i.ap='p';i.apBy=i.apName=i.apRole='';i.apAt=0;i.ea=Date.now();apPush([i])}
function setRole(v){D.prof.role=v;save(true);lvlPush();render()}
async function lvlPush(){try{if(!U||cloudOff())return;const e=myEm(),ui=await rid('u',e),u=(await rdGet(ui))||{e,n:U.name||e,r:'user',c:Date.now(),l:Date.now()},j=myLvl();if((u.j||'')!=j){u.j=j;await rdSet(ui,u)}}catch(x){console.error('lvl',x)}}
/* ---------- APPROVAL PANEL (Developer) ---------- */
function apPanel(){calInit();const o=BXO.apanel,day=AQ.cal,l=D.insp.filter(i=>dtIn(i.dt).slice(0,10)==day),ap=l.filter(i=>i.ap=='a').sort((x,y)=>(y.apAt||0)-(x.apAt||0));
  return`<div class="c" id="cb_apanel"><button type="button" class="flex justify-between items-center w-full" style="text-align:left;cursor:pointer" onclick="bxTog('apanel')"><b>Approval Panel</b>${bxIcon(o)}</button><div class="cbb" style="display:${o?'block':'none'}"><p class="text-xs opacity-60 my-1">Khusus Developer. Pilih tanggal di kalender, lalu batalkan approval data pada tanggal itu.</p>${calView()}<div class="text-sm mt-2"><b>${ap.length}</b> data Approved &middot; <b>${l.length-ap.length}</b> Pending approval</div>${ap.length?`<div style="max-height:260px;overflow-y:auto;margin-top:6px">${ap.map(i=>`<div class="py-2" style="border-top:1px solid rgba(128,128,128,.25)"><div class="flex justify-between items-start gap-2"><div style="min-width:0" class="text-sm"><b>${esc(i.main)}</b> <span class="text-xs opacity-70">${esc(i.sub)} ${esc(i.subType||'')} - ${esc(i.mat)} - ${f1(i.kA)} kA</span><div class="text-xs" style="color:#16a34a">&#10003; Approved: ${esc(i.apName||i.apBy||'-')}${i.apRole?' ('+esc(i.apRole)+')':''}${i.apAt?' - '+new Date(i.apAt).toLocaleString(LC(),{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'}):''}</div></div><button class="b bd" style="padding:4px 10px;font-size:12px;flex:none" onclick="apUndo('${i.id}')">Cancel</button></div></div>`).join('')}</div><button class="b bd mt-2" style="width:100%" onclick="apCancelDay()">&#10005; Cancel Approval tanggal ini (${ap.length} data)</button>`:`<p class="text-xs opacity-60 mt-1">Tidak ada data Approved pada tanggal ini.</p>`}</div></div>`}
function apCancelDay(){if(!isDev())return;const day=AQ.cal,l=D.insp.filter(i=>i.ap=='a'&&dtIn(i.dt).slice(0,10)==day);if(!l.length)return toast('Tidak ada data Approved pada tanggal ini');if(!confirm('Cancel approval '+l.length+' data tanggal '+day+'?\nData akan kembali Pending approval.'))return;l.forEach(i=>{i.ap='p';i.apBy=i.apName=i.apRole='';i.apAt=0;i.ea=Date.now();i.apCx=myEm();i.apCxAt=Date.now()});apPush(l);awSuccess('Approval dibatalkan',l.length+' data kembali Pending')}
/* ---------- DATA: PENGINPUT & HAK HAPUS ---------- */
const canDel=i=>isDev()||(!!i.userId&&!!U&&String(i.userId).toLowerCase()==String(U.id).toLowerCase());
const inpShow=i=>isDev()?inpName(i):(i.userName||String(i.userEmail||i.userId||'-').split('@')[0]);
const inpName=i=>{const n=i.userName||'',e=i.userEmail||i.userId||'';return n&&e&&n!=e?n+' ('+e+')':(n||e||'-')};
const cmSolved=i=>!!(i.cm)&&stV(i)=='NG'&&cmJv(i,i.cmKA)=='OK';
const stD=i=>cmSolved(i)?'OK':stV(i);
const slvB=(c)=>`<span class="slvB${c?' '+c:''}">&#10003; Solved</span>`;
const stSide=i=>{const v=stD(i),c=v=='OK'?'ok':'no',p=!!i.photo;
  const b=`<span class="bg stB ${c}${p?' p':''}" style="display:flex;align-items:center;justify-content:center;margin:0;padding:0;flex-shrink:0;box-sizing:border-box;font-weight:800">${v}</span>`;
  return`<div class="stS">${p?`<div class="stE"><span class="stEv">Evidence</span><img class="stP rounded-lg" src="${i.photo}"></div>`:''}${b}</div>`};
const dcCmp=i=>{const v=stD(i),c=v=='OK'?'ok':'no',p=!!i.photo,a=apSt(i)=='a';
  return`<div class="dcC"><div class="dcT"><span>${new Date(i.dt).toLocaleDateString(LC())}</span><span class="apBx ${a?'apOk':'apPd'}">${a?'&#10003; Approved':'Pending'}</span>${cmSolved(i)?slvB('sm'):''}</div><div class="dcN">${esc(i.main)}</div><div class="dcV">${f1(i.kA)}<small>kA</small></div><div class="dcD">Standar ${f1(i.min)} - ${f1(i.max)} kA</div><div class="dcB">${p?`<img class="stP rounded-lg" src="${i.photo}">`:''}<span class="bg stB ${c}" style="display:flex;align-items:center;justify-content:center;margin:0 0 0 auto;padding:0;flex-shrink:0;box-sizing:border-box;font-weight:800">${v}</span></div></div>`};
const dcLst=i=>{const v=stD(i),c=v=='OK'?'ok':'no',a=apSt(i)=='a',ck=[i.c1,i.c2].filter(Boolean).join(' / ')||'-',em=i.userEmail||i.userId||'-',d=new Date(i.dt).toLocaleDateString(LC(),{day:'2-digit',month:'short',year:'2-digit'}).replace(/ /g,'-'),
  bt=a?`<div class="dlWho">${esc(i.apName||i.apBy||'-')}${i.apRole?' ('+esc(i.apRole)+')':''}</div>`:(canAp1(i)?`<button type="button" class="b dlAp apAct" onclick="event.stopPropagation();apDo('${i.id}')">&#10003; Approve</button>`:'');
  return`<div class="dcL"><div class="dlH"><b class="dlE">${esc(i.main)}</b>${i.subType?`<span class="bg bgT">${esc(i.subType)}</span>`:''}<span class="bg bgS">${esc(i.sub)}</span><span class="bg bgM">${esc(i.mat)}</span><span class="bg ${a?'apOk':'apPd'} dlP">${a?'&#10003; Approved':'Pending'}</span></div><div class="dlLn"></div><div class="dlB"><div class="dlL"><div class="dlSd">Std: ${f1(i.min)} - ${f1(i.max)} kA</div><div class="dlC">Check : ${esc(ck)}</div><div class="dlC">Input &nbsp;: ${esc(inpShow(i))}</div><div class="dlAr">${bt}${cmSolved(i)?slvB():''}</div></div><div class="dlR"><div class="dlX"><span class="dlK"><b>${f1(i.kA)}</b><i>kA</i></span><span class="bg dlO ${c}">${v}</span>${i.photo?`<img class="dlF" src="${i.photo}" alt="">`:''}</div><div class="dlD">&bull; ${esc(d)}</div></div></div></div>`};
const dcPc=i=>{const v=stD(i),c=v=='OK'?'ok':'no',a=apSt(i)=='a',ck=[i.c1,i.c2].filter(Boolean).join(' / ')||'-',em=i.userEmail||i.userId||'-',d=new Date(i.dt).toLocaleDateString(LC(),{day:'2-digit',month:'short',year:'2-digit'}).replace(/ /g,'-'),
  bt=a?`<span class="pAp">&#10003; Approved</span><span class="pWo"><span>Approved by: ${esc(i.apName||i.apBy||'-')}</span>${i.apRole?`<span>${esc(i.apRole)}</span>`:''}</span>`:(canAp1(i)?`<button type="button" class="pAp apAct" onclick="event.stopPropagation();apDo('${i.id}')">&#10003; Approve</button>`:'');
  return`<div class="dcP"><div class="pH"><span class="pE"><b>${esc(i.main)}</b>${Date.now()-i.created<3e5?' <span class="pb pN">BARU</span>':''}</span><span class="pTg">${i.subType?`<span class="pb pT">${esc(i.subType)}</span>`:''}<span class="pb pK">${esc(i.sub)}</span><span class="pb pM">${esc(i.mat)}</span></span><span class="pb pS ${a?'ap':'pe'}">${a?'&#10003; Approved':'Pending'}</span></div><div class="pLn"></div><div class="pB"><div class="pI"><div class="pLp">Line Process: ${esc(i.loc||'-')}</div><div class="pSd">Std: ${f1(i.min)} - ${f1(i.max)} kA</div><div class="pC">Check : ${esc(ck)}</div><div class="pC">Input &nbsp;: ${esc(inpShow(i))}</div></div><div class="pX"><span class="pBk"><b>${f1(i.kA)}</b><i>kA</i></span><span class="pBo ${c}">${v}</span>${i.photo?`<img class="pBf" src="${i.photo}" alt="">`:`<span class="pBf n"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-4 4 3 3-2 6 4"/></svg>No image<br>available</span>`}</div></div><div class="pFt">${bt}${cmSolved(i)?slvB('pSv'):''}<span class="pD">&bull; ${esc(d)}</span></div></div>`};
function dataCard(i,n){
  const info=`<div class="dcF"><div class="flex-1 text-sm"><div class="text-xs opacity-60">${new Date(i.dt).toLocaleString(LC())} ${Date.now()-i.created<3e5?'<span class="bg or">BARU</span>':''}</div><b>${esc(i.main)}</b> ${i.subType?`<span class="bg bgT">${esc(i.subType)}</span> `:''}<span class="bg bgS">${esc(i.sub)}</span> <span class="bg bgM">${esc(i.mat)}</span><div class="dkA"><span class="dkN">${f1(i.kA)}</span> <span class="dkU">kA</span> <span class="dkS">(std ${f1(i.min)}-${f1(i.max)})</span></div><div class="text-xs opacity-70">${esc(i.c1)} ${esc(i.c2)} - ${esc(i.loc)}</div><div class="text-xs opacity-60 mt-1" style="word-break:break-all">&#128100; Input oleh: ${esc(inpShow(i))}</div>${apRow(i)}</div>${stSide(i)}</div>${dcCmp(i)}${dcLst(i)}${dcPc(i)}`;
  if(!canDel(i))return`<div class="c dc"><div style="display:flex;gap:12px;cursor:pointer" onclick="detail('${i.id}')">${info}</div></div>`;
  return`<div class="c dc sw-c${n==0&&!L.woms_swh?(L.woms_swh=1,' hint'):''}"><button type="button" class="sw-del" onclick="event.stopPropagation();delInsp('${i.id}')"><span style="font-size:20px">&#128465;</span>Hapus</button><div class="sw-in" onclick="detail('${i.id}')">${info}</div></div>`}
/* ---------- FILTER GRAFIK: EQUIPMENT, LOKASI, TANGGAL/BULAN/TAHUN ---------- */
const eqList=()=>G.main?[G.main]:D.mains.map(m=>m.id);
const lcList=()=>{if(G.loc)return[G.loc];const ls=[...D.M.locs];D.insp.forEach(i=>{const l=i.loc||'';if(!ls.includes(l))ls.push(l)});return ls};
const eqNm=id=>(mainBy(id)||{}).code||id,lcNm=l=>l||'(tanpa lokasi)';
function selTxt(sel,all,f){if(!sel||sel.length>=all.length)return all.length==1?f(all[0]):'Semua';return sel.length>3?sel.length+' dipilih':sel.map(f).join(', ')}
function gpSec(t,all,sel,fn,labf,tog,id){sel=sel||[];return`<div class="flex justify-between items-center mt-2 mb-1"><b class="text-sm">${t}</b><button class="text-blue-600 text-xs" onclick="${tog}()">${sel.length==all.length?'Hapus semua':'Pilih semua'}</button></div><div id="${id}" style="max-height:150px;overflow-y:auto">${all.map((x,k)=>`<label class="flex items-center gap-2 py-1 text-sm" style="margin:0"><input type="checkbox" ${sel.includes(x)?'checked':''} onchange="${fn}(${k})"> ${esc(labf(x))}</label>`).join('')}</div>`}
function gpR(){const q=['#gpbox','#gpe','#gpl'],o=q.map(k=>{const e=$(k);return e?e.scrollTop:0});render();q.forEach((k,i)=>{const e=$(k);if(e)e.scrollTop=o[i]})}
function gpTe(k){const m=eqList()[k],i=GP.eq.indexOf(m);i<0?GP.eq.push(m):GP.eq.splice(i,1);gpR()}
function gpTl(k){const m=lcList()[k],i=GP.lc.indexOf(m);i<0?GP.lc.push(m):GP.lc.splice(i,1);gpR()}
function gpAllE(){GP.eq=GP.eq.length==eqList().length?[]:[...eqList()];gpR()}
function gpAllL(){GP.lc=GP.lc.length==lcList().length?[]:[...lcList()];gpR()}
function dateTxt(){return G.cal?new Date(...G.cal.split('-').map((x,k)=>k==1?x-1:+x)).toLocaleDateString(LC(),{day:'numeric',month:'long',year:'numeric'}):'Semua'}
/* ---------- BAGIKAN APLIKASI ---------- */
const appUrl=()=>/^https?:$/.test(location.protocol)?location.origin+location.pathname.replace(/index\.html$/,''):'';
async function shareApp(){const url='https://tinyurl.com/wps-adm-app',msg='WMS - Welding Monitoring System\n'+url;
  if(navigator.share){try{await navigator.share({text:msg});return}catch(e){if(e&&e.name=='AbortError')return}}
  try{await navigator.clipboard.writeText(msg);toast('Link aplikasi disalin')}catch(e){prompt('Salin link aplikasi:',msg)}}
(function init(){initLock();try{const n=JSON.parse(L.woms_nav||'null');if(n&&L.woms_user&&!L.woms_lock&&['home','app','qg'].includes(n.s)&&['input','data','grafik','master','setting','developer'].includes(n.t))NAVR=n}catch(e){}
document.documentElement.dataset.theme=L.woms_theme||'light';document.documentElement.dataset.view=curView();try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}
let rzT,lastW=innerWidth;const onRot=()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(innerWidth==lastW)return;lastW=innerWidth;if(!L.woms_view){const v=curView();if(document.documentElement.dataset.view!=v)document.documentElement.dataset.view=v}if(U)render()},250)};addEventListener('resize',onRot);addEventListener('orientationchange',onRot);
if(!SERVER&&!RC)try{const u=JSON.parse(L.woms_user||'null');if(u&&!L.woms_lock){U=u;load(u.id);if(NAVR&&String(NAVR.u)==String(u.id)){scr=NAVR.s;tab=NAVR.t;navIn(NAVR)}NAVR=null}}catch(e){}
render();if(!U){const n=$('nav');if(n)n.remove()}})();
const NAVK=['dt','c1','c2','shift','job','desc','main','sub','mat'];
function navSave(){if(!U)return;try{const i2=scr=='app'&&tab=='input'&&IG&&(F.step==1||F.step==2),f={};if(i2)NAVK.forEach(k=>{if(F[k])f[k]=F[k]});L.woms_nav=JSON.stringify({s:scr,t:tab,u:U.id,i2:i2?1:0,st:i2?F.step:0,f:i2?f:null})}catch(e){}}
function navIn(n){if(n&&n.i2&&n.f&&n.s=='app'&&n.t=='input'){IG=true;F=Object.assign({},n.f,{step:n.st==1?1:2});IH.open=true}}
addEventListener('pagehide',navSave);document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='hidden')navSave()});
const _r=render;render=function(){_r();if(U){try{navSave()}catch(e){}}if(!U){const n=$('nav');if(n)n.remove()}else if(CB!==myEm())cloudBoot()};
if(SERVER)fbInit();
</script></body></html>
